name: Windows installer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Syntax, rule, authorization, renderer and performance regression tests
        run: npm test
      - name: Build Windows x64 NSIS installer
        run: npm run dist:win
      - name: Verify packaged application and record checksums
        run: node scripts/build-manifest.cjs
      - name: Install and start the packaged program on Windows
        run: npm run test:installed
      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Xunjian-Wuhu-Windows-x64
          path: |
            dist/Xunjian-Wuhu-Setup-*.exe
            dist/build-manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
