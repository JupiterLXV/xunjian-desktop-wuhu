name: Windows installer
on:
  push:
    branches: [main, ui-simplify-5046]
    paths-ignore: ['docs/**', 'README.md', 'CHANGELOG.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Prepare local Windows SMB test share
        shell: pwsh
        run: |
          $shareName = "XunjianCI-${{ github.run_id }}"
          $shareRoot = Join-Path $env:RUNNER_TEMP $shareName
          New-Item -ItemType Directory -Path $shareRoot -Force | Out-Null
          try {
            Start-Service LanmanServer -ErrorAction Stop
            $runnerUser = "$env:USERDOMAIN\$env:USERNAME"
            New-SmbShare -Name $shareName -Path $shareRoot -FullAccess $runnerUser -ErrorAction Stop | Out-Null
            "XUNJIAN_TEST_UNC=\\localhost\$shareName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } catch {
            Write-Warning "Local SMB unavailable; UNC integration test will explicitly skip: $_"
          }
      - name: Syntax, rule, authorization, renderer and performance regression tests
        run: npm test
      - name: Build Windows x64 NSIS installer
        run: npm run dist:win
      - name: Verify packaged application, original logo and checksums
        run: |
          node scripts/build-manifest.cjs
          node scripts/verify-icons.cjs "dist/win-unpacked/巡检缺陷工具-芜湖.exe" "dist/Xunjian-Wuhu-Setup-50.4.6-x64.exe"
      - name: Download previous installer for profile-preservation upgrade test
        if: github.ref_name == 'ui-simplify-5046'
        uses: actions/download-artifact@v4
        with:
          name: Xunjian-Wuhu-Windows-x64
          run-id: 45730576420
          github-token: ${{ github.token }}
          path: upgrade-baseline
      - name: Verify application rename preserves the existing default profile
        if: github.ref_name == 'ui-simplify-5046'
        run: node scripts/test-rename-upgrade.cjs
      - name: Install and start the packaged program on Windows
        run: npm run test:installed
      - name: Upload installer and checksums
        uses: actions/upload-artifact@v4
        with:
          name: Xunjian-Wuhu-Windows-x64
          path: |
            dist/Xunjian-Wuhu-Setup-*.exe
            dist/build-manifest.json
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-results
          path: |
            playwright-report/
            test-results/
            taskbar-proof/
          if-no-files-found: ignore
          retention-days: 14
      - name: Remove local test share
        if: always()
        shell: pwsh
        run: |
          Get-SmbShare -Name "XunjianCI-${{ github.run_id }}" -ErrorAction SilentlyContinue | Remove-SmbShare -Force -ErrorAction SilentlyContinue
